# Declared explicitly rather than left to PEP 517's legacy fallback. The `attr:`
# version directive needs setuptools >= 61, and a public sdist should not depend
# on whatever setuptools a builder happens to have.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spindle-mcp"
# Read from spindle/_version.py so the wheel metadata, `spindle --version`, the
# /health payload and `spindle doctor` can never disagree about the version.
dynamic = ["version"]
description = "MCP server for multi-harness AI agent delegation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "claude", "claude-code", "agent", "delegation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.0.0,<3",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    # Match the exact Ruff release used by both CI jobs and the pre-push hook.
    "ruff==0.16.3",
]

[project.urls]
Homepage = "https://github.com/smythp/spindle"
Repository = "https://github.com/smythp/spindle"
Issues = "https://github.com/smythp/spindle/issues"

[project.scripts]
spindle = "spindle:main"

[tool.setuptools]
packages = ["spindle"]
# Detached helpers are deliberately top-level modules. They set their process
# guards before importing the spindle package and are packaged beside it.
py-modules = ["spindle_claude_driver", "spindle_owner", "spindle_supervisor"]

[tool.setuptools.dynamic]
version = { attr = "spindle._version.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long - handled by line-length

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["ns_required: requires a working real bubblewrap PID namespace"]
