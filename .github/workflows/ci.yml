name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system test dependencies
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 otherwise blocks bwrap's unprivileged user namespace.
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-pid --ro-bind / / --dev /dev --proc /proc /bin/true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests with namespace coverage
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/ -v

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: |
          pytest tests/ -v -m "not ns_required"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.16.3"

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .
